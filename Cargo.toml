[package]
name = "logsculpt"
version = "0.1.0"
edition = "2021"
description = "Streaming log parser, normalizer, and anomaly-detecting timeline TUI for incident response"
license = "MIT"
authors = ["logsculpt contributors"]
repository = "https://github.com/example/logsculpt"
readme = "README.md"

[[bin]]
name = "logsculpt"
path = "src/main.rs"

[lib]
name = "logsculpt"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rayon = "1"
ratatui = "0.29"
crossterm = "0.28"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
csv = "1"
anyhow = "1"

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[[bench]]
name = "throughput"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
